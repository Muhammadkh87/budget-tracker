name: Run Tests

# triggers on every push to ANY branch
# we always want tests to run
# regardless of which branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify app starts
        run: |
          node -e "require('./server.js')" &
          sleep 5
          kill %1
          echo "App started successfully ✅"