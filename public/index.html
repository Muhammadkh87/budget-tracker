<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker</title>
  <style>
    /* Basic styling — clean and readable, nothing fancy */
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #2c3e50; }
    .summary { display: flex; gap: 20px; margin-bottom: 30px; }
    .card { flex: 1; padding: 15px; border-radius: 8px; text-align: center; }
    .income-card { background: #d5f5e3; }
    .expense-card { background: #fadbd8; }
    .balance-card { background: #d6eaf8; }
    .card h3 { margin: 0 0 8px; font-size: 14px; color: #555; }
    .card p { margin: 0; font-size: 22px; font-weight: bold; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button[type="submit"] { grid-column: span 2; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f4f4f4; }
    .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .income { color: green; }
    .expense { color: red; }
  </style>
</head>
<body>

  <h1>💰 Budget Tracker</h1>

  <!-- Summary Cards -->
  <div class="summary">
    <div class="card income-card">
      <h3>Total Income</h3>
      <p id="total-income">$0.00</p>
    </div>
    <div class="card expense-card">
      <h3>Total Expenses</h3>
      <p id="total-expenses">$0.00</p>
    </div>
    <div class="card balance-card">
      <h3>Balance</h3>
      <p id="balance">$0.00</p>
    </div>
  </div>

  <!-- Add Transaction Form -->
  <h2>Add Transaction</h2>
  <form id="transaction-form">
    <select id="type" required>
      <option value="">-- Type --</option>
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>
    <input id="category" type="text" placeholder="Category (e.g. Rent)" required />
    <input id="description" type="text" placeholder="Description" required />
    <input id="amount" type="number" placeholder="Amount" step="0.01" min="0" required />
    <input id="date" type="date" required />
    <button type="submit">Add Transaction</button>
  </form>

  <!-- Transactions Table -->
  <h2>Transactions</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="transactions-body">
      <!-- Rows are inserted here by JavaScript -->
    </tbody>
  </table>

  <script>
    // --- Helper: format a number as currency ---
    const fmt = n => '$' + parseFloat(n).toFixed(2);

    // --- Load and display all transactions from the API ---
    async function loadTransactions() {
      // fetch() is a built-in browser function to make HTTP requests
      const res = await fetch('/api/transactions');
      const transactions = await res.json();

      let totalIncome = 0;
      let totalExpenses = 0;
      const tbody = document.getElementById('transactions-body');
      tbody.innerHTML = ''; // Clear existing rows before re-rendering

      transactions.forEach(t => {
        // Tally up income and expenses for the summary cards
        if (t.type === 'income') totalIncome += t.amount;
        else totalExpenses += t.amount;

        // Create a new table row for each transaction
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${t.date}</td>
          <td class="${t.type}">${t.type}</td>
          <td>${t.category}</td>
          <td>${t.description}</td>
          <td class="${t.type}">${fmt(t.amount)}</td>
          <td><button class="delete-btn" onclick="deleteTransaction(${t.id})">Delete</button></td>
        `;
        tbody.appendChild(row);
      });

      // Update the summary cards
      document.getElementById('total-income').textContent = fmt(totalIncome);
      document.getElementById('total-expenses').textContent = fmt(totalExpenses);
      document.getElementById('balance').textContent = fmt(totalIncome - totalExpenses);
    }

    // --- Handle form submission ---
    document.getElementById('transaction-form').addEventListener('submit', async (e) => {
      e.preventDefault(); // Stop the browser from refreshing the page

      // Read values from the form fields
      const body = {
        type:        document.getElementById('type').value,
        category:    document.getElementById('category').value,
        description: document.getElementById('description').value,
        amount:      document.getElementById('amount').value,
        date:        document.getElementById('date').value
      };

      // Send a POST request to our API with the form data as JSON
      await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      e.target.reset();      // Clear the form
      loadTransactions();    // Refresh the list
    });

    // --- Delete a transaction ---
    async function deleteTransaction(id) {
      await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
      loadTransactions(); // Refresh the list after deletion
    }

    // Load transactions when the page first opens
    loadTransactions();
  </script>

</body>
</html>
